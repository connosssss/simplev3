
<script src="chrome://browser/content/preferences/simpleAppearance.js"/>

<html:template id="template-paneSimpleAppearance">
<hbox id="simpleAppearanceCategory"
      class="subcategory"
      hidden="true"
      data-category="paneSimpleAppearance">
  <html:h1>Appearance</html:h1>
</hbox>

<groupbox id="simpleAppearanceGroup"
          data-category="paneSimpleAppearance"
          hidden="true">
  <checkbox id="transparentToolbar"
            label="Semi-transparent tabbar &amp; address bar"
            preference="simple.theme.transparent-toolbar"/>

  <hbox id="transparentToolbarOpacityBox" align="center" style="margin-inline-start: 24px; gap: 8px; margin-block: 4px 8px;">
    <label control="transparentToolbarOpacity">Opacity:</label>
    <html:input id="transparentToolbarOpacity"
                type="range" min="10" max="90" step="5"
                preference="simple.theme.transparent-toolbar.opacity"/>
    <html:span id="transparentToolbarOpacityLabel" style="min-width: 40px; font-weight: 500;">55%</html:span>
  </hbox>
</groupbox>
</html:template>
